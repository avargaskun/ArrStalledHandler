services:
  arr-stalled-handler:
    image: ghcr.io/avargaskun/arrstalledhandler:latest
    container_name: ArrStalledHandler
    restart: unless-stopped
    # Forwards every name in .env into the container, so variables referenced
    # from config.yaml (see README "Variable substitution") resolve there too.
    # Safe because this .env is app-scoped; with a .env shared across services,
    # drop this and list only the names you need in `environment:` below.
    # The `required:` form needs Compose 2.24+; on older versions use `env_file: .env`.
    env_file:
      - path: .env
        required: false
    environment:
      RADARR_URL: "${RADARR_URL}" # Radarr URL
      RADARR_API_KEY: "${RADARR_API_KEY}" # Radarr API Key
      SONARR_URL: "${SONARR_URL}" # Sonarr URL
      SONARR_API_KEY: "${SONARR_API_KEY}" # Sonarr API Key
      LIDARR_URL: "${LIDARR_URL}" # Lidarr URL
      LIDARR_API_KEY: "${LIDARR_API_KEY}" # Lidarr API Key
      READARR_URL: "${READARR_URL}" # Readarr URL
      READARR_API_KEY: "${READARR_API_KEY}" # Readarr API Key
      QBITTORRENT_URL: "${QBITTORRENT_URL}" # qBittorrent WebUI URL (leave empty to disable qBittorrent integration)
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME}" # qBittorrent WebUI username
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD}" # qBittorrent WebUI password
      IGNORE_TORRENT_TAGS: "${IGNORE_TORRENT_TAGS}" # Comma-separated qBittorrent tags whose torrents are never handled
      STALLED_TIMEOUT: "${STALLED_TIMEOUT}" # How long a download should be stalled before handling it (in seconds)
      STALLED_ACTION: "${STALLED_ACTION}" # Options: REMOVE or BLOCKLIST or BLOCKLIST_AND_SEARCH (new disposition names are also accepted)
      VERBOSE: "${VERBOSE}" # Enable verbose/debug logging
      RUN_INTERVAL: "${RUN_INTERVAL}" # How often should the script be run (in seconds)
      COUNT_DOWNLOADING_METADATA_AS_STALLED: "${COUNT_DOWNLOADING_METADATA_AS_STALLED}" # If it should count downloads with the "Downloading Metadata" as stalled
    # Uncomment to provide a YAML config file (see README "YAML configuration"):
    # volumes:
    #   - ./config.yaml:/data/config.yaml:ro
